name: Build DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # ── Set up Theos ────────────────────────────────────────────────────────
      - name: Set up Theos
        uses: theos/theos-action@main

      # ── Build the Swift app (unsigned arm64) ────────────────────────────────
      - name: Build app
        working-directory: AirTagCat
        run: |
          xcodebuild \
            -project AirTagCat.xcodeproj \
            -target AirTagCat \
            -sdk iphoneos \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$(pwd)/build"

      - name: Re-sign app with no-sandbox entitlement
        run: |
          codesign -f -s "-" \
            --entitlements AirTagCat/AirTagCat/AirTagCat.entitlements \
            AirTagCat/build/Release-iphoneos/AirTagCat.app

      # ── Stage app into Theos layout so it ships inside the .deb ────────────
      - name: Stage app in Theos layout
        run: |
          mkdir -p Tweak/layout/var/jb/Applications
          cp -R AirTagCat/build/Release-iphoneos/AirTagCat.app \
                Tweak/layout/var/jb/Applications/AirTagCat.app

      # ── Build the Theos package (tweak dylib + app = combined .deb) ─────────
      - name: Build Theos package
        working-directory: Tweak
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Locate .deb
        id: deb
        run: |
          FILE=$(ls Tweak/packages/*.deb | head -1)
          echo "path=$FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename $FILE)" >> $GITHUB_OUTPUT
          echo "size=$(du -sh $FILE | cut -f1)" >> $GITHUB_OUTPUT

      # ── Publish GitHub Release ───────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" "${{ steps.deb.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AirTagCat $TAG" \
            --notes $'**Requires Dopamine jailbreak (iOS 15 – 16.6.1)**\n\n## Install\n1. AirDrop or SSH the `.deb` to your iPhone\n2. Open it with **Sileo** → install\n3. Respring when prompted — locationd restarts automatically\n4. Open **AirTagCat** from the home screen\n\nThe app reads AirTag data directly from `locationd`. No BLE scanning needed.' \
            --latest
