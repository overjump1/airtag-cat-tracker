name: Build DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Any macOS runner works — no Theos, no special toolchain needed.
    # macos-13, macos-14, macos-15 are all fine; use the matrix so whichever
    # GitHub has capacity for picks up the job first.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-13, macos-14, macos-15]
      fail-fast: false   # let all runners try; first to finish publishes the release
    continue-on-error: false

    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # ── Swift app ──────────────────────────────────────────────────────────
      - name: Build app (unsigned arm64)
        working-directory: AirTagCat
        run: |
          xcodebuild \
            -project AirTagCat.xcodeproj \
            -target AirTagCat \
            -sdk iphoneos \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$(pwd)/build"

      - name: Re-sign app with no-sandbox entitlement
        run: |
          codesign -f -s "-" \
            --entitlements AirTagCat/AirTagCat/AirTagCat.entitlements \
            AirTagCat/build/Release-iphoneos/AirTagCat.app

      # ── Tweak dylib (plain clang, no Theos) ───────────────────────────────
      - name: Build tweak dylib
        run: |
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -arch arm64e \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -fno-objc-arc \
            -fobjc-exceptions \
            -framework Foundation \
            -o Tweak/AirTagCatTweak.dylib \
            Tweak/Tweak.m
          codesign -f -s "-" Tweak/AirTagCatTweak.dylib

      # ── Assemble .deb manually (no Theos packaging needed) ────────────────
      - name: Package .deb
        run: |
          R=$(mktemp -d)
          mkdir -p "$R/DEBIAN"
          mkdir -p "$R/var/jb/Library/MobileSubstrate/DynamicLibraries"
          mkdir -p "$R/var/jb/Applications"

          cp Tweak/AirTagCatTweak.dylib  "$R/var/jb/Library/MobileSubstrate/DynamicLibraries/"
          cp Tweak/AirTagCatTweak.plist  "$R/var/jb/Library/MobileSubstrate/DynamicLibraries/"
          cp -R AirTagCat/build/Release-iphoneos/AirTagCat.app "$R/var/jb/Applications/"

          # Strip leading whitespace that heredoc indentation adds
          sed 's/^          //' > "$R/DEBIAN/control" << 'CTRL'
          Package: com.local.airtagcat
          Name: AirTagCat
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: Track your cat's AirTag — hooks locationd for real proximity
          Maintainer: AirTagCat <noreply@local>
          Author: AirTagCat
          Section: Tweaks
          Depends: mobilesubstrate | libhooker | substitute
          CTRL

          install -m 755 Tweak/postinst "$R/DEBIAN/postinst"

          brew install dpkg 2>/dev/null || true
          dpkg-deb --build "$R" AirTagCat.deb
          echo "size=$(du -sh AirTagCat.deb | cut -f1)"

      # ── Release ───────────────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use commit SHA so duplicate runners don't create conflicting tags
          TAG="v$(git rev-parse --short HEAD)"
          gh release create "$TAG" AirTagCat.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "AirTagCat $TAG" \
            --notes $'**Requires Dopamine jailbreak (iOS 15 – 16.6.1)**\n\n## Install\n1. AirDrop or SSH the `.deb` to your iPhone\n2. Open it with **Sileo** → install\n3. Respring when prompted — locationd restarts automatically\n4. Open **AirTagCat** from the home screen\n\nThe app reads AirTag data directly from `locationd`. No BLE scanning needed.' \
            --latest 2>/dev/null \
          || gh release upload "$TAG" AirTagCat.deb --clobber
